# Render Infrastructure Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-canteen-ordering-system
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

